name: Build Pocket Tunnel APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Build Android cloudflared connector
        run: |
          git clone --depth 1 --branch 2026.10.0 https://github.com/cloudflare/cloudflared.git /tmp/cloudflared
          mkdir -p app/src/main/assets/runtime/arm64-v8a
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd /tmp/cloudflared
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$NDK_BIN/aarch64-linux-android29-clang" go build -tags=netcgo -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/app/src/main/assets/runtime/arm64-v8a/cloudflared" ./cmd/cloudflared
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-tunnel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
